name: Security & Audit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-check:
    name: Verify Zero-Backend & BYOK Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint Public Code Base
        run: |
          ruff check src/ tests/test_audit_public.py

      - name: Run Zero-Backend & Integrity Test Suite
        run: |
          pytest tests/test_audit_public.py -v

[pytest]
testpaths = tests
pythonpath = .
# Los tests marcados 'live' llaman a proveedores reales (Gemini/Groq): consumen
# red y cuota de dinero. Se saltan por defecto; se ejecutan solo a propósito con
# `pytest --live` (ver tests/conftest.py).
markers =
    live: test que llama a APIs reales (red/cuota). Skipped por defecto; usar `pytest --live`.
